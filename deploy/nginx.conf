server {
    listen 80;
    server_name foi.example.gov.ph;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name foi.example.gov.ph;

    ssl_certificate /etc/letsencrypt/live/foi.example.gov.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foi.example.gov.ph/privkey.pem;
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:4320;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
